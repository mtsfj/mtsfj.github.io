<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · Mathis Fajeau</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f0c22">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #0f0c22; color: #cfc4ff;
    font-family: 'Inter Tight', system-ui, sans-serif;
    display: grid; place-items: center; overflow: hidden;
  }
  /* la même pluie fine que le hero, en CSS */
  body::before {
    content: ''; position: fixed; inset: -20%;
    background: repeating-linear-gradient(103deg, transparent 0 7px, rgba(216, 208, 255, .07) 7px 9px);
    animation: rain 0.9s linear infinite; pointer-events: none;
  }
  @keyframes rain { to { transform: translateY(48px); } }
  @media (prefers-reduced-motion: reduce) { body::before { animation: none; } }
  main { text-align: center; padding: 24px; position: relative; }
  h1 {
    font-family: 'Silkscreen', monospace; font-size: clamp(64px, 18vw, 160px); line-height: 1;
    color: #ffb3d9; text-shadow: 0 0 18px rgba(255, 138, 209, .55), 0 0 60px rgba(255, 138, 209, .25);
  }
  p { margin-top: 18px; font-size: 17px; }
  p .en { color: #8f86b8; }
  a {
    display: inline-block; margin-top: 26px; padding: 10px 18px;
    color: #a8e6ff; text-decoration: none; border: 1px solid #3d3560; border-radius: 6px;
  }
  a:hover { border-color: #a8e6ff; box-shadow: 0 0 14px rgba(168, 230, 255, .3); }
</style>
</head>
<body>
<main>
  <h1>404</h1>
  <p>Cette rue n'existe pas. <span class="en">This street does not exist.</span></p>
  <a href="/">Retour à la ville · Back to the city</a>
</main>
</body>
</html>
