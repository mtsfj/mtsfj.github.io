<style>
  /* the page's own: one lit sign in the rain (the charter does the rest) */
  html, body { height: 100%; }
  body { background: var(--night-deep); display: grid; place-items: center; overflow: hidden; }
  body::before { content: ''; position: fixed; inset: -20%; background: repeating-linear-gradient(103deg, transparent 0 7px, rgba(216,208,255,.07) 7px 9px); animation: rain .9s linear infinite; pointer-events: none; }
  @keyframes rain { to { transform: translateY(48px); } }
  main { text-align: center; padding: 24px; position: relative; }
  .display { font-size: clamp(64px, 18vw, 160px); line-height: 1; color: #ffb3d9; margin: 0; text-shadow: 0 0 18px rgba(255,138,209,.55), 0 0 60px rgba(255,138,209,.25); }
  .btns { justify-content: center; }
  .lede { margin: 18px auto 26px; max-width: none; font-size: 17px; color: var(--paper); }
</style>
</head>

<main>
  <h1 class="display">404</h1>
